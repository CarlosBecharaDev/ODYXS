services:
  db:
    image: mariadb:10.11
    container_name: odyxs-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-odyxsvg_db}
      MARIADB_USER: ${DB_USERNAME:-odyxs_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-odyxs_pass}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      # Persistencia de datos entre reinicios
      - odyxs_db_data:/var/lib/mysql
      # Carga automática del esquema + datos la PRIMERA vez que se crea el volumen
      # ":z" reetiqueta el archivo para SELinux (necesario en Fedora/RHEL)
      - ./sql/odyxsvg_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Aplicación Spring Boot. Arranca solo cuando la BD está "healthy".
  # Si solo quieres la base de datos, usa:  docker compose up -d db
  app:
    build: .
    container_name: odyxs-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro de la red de compose la BD es accesible por el nombre "db"
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-odyxsvg_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-odyxs_user}
      DB_PASSWORD: ${DB_PASSWORD:-odyxs_pass}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - odyxs_uploads:/app/odyxs-uploads

volumes:
  odyxs_db_data:
  odyxs_uploads:
