services:
  db:
    image: mariadb:10.11
    container_name: odyxs-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-odyxsvg_db}
      MARIADB_USER: ${DB_USERNAME:-odyxs_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-odyxs_pass}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      # Persistencia de datos entre reinicios
      - odyxs_db_data:/var/lib/mysql
      # Carga automática del esquema + datos la PRIMERA vez que se crea el volumen
      # ":z" reetiqueta el archivo para SELinux (necesario en Fedora/RHEL)
      - ./sql/odyxsvg_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  odyxs_db_data:
