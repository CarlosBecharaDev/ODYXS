spring.application.name=odyxs

# Conexion a la base de datos (los valores por defecto sirven para docker-compose;
# se pueden sobrescribir con variables de entorno DB_URL / DB_USERNAME / DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/odyxsvg_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:odyxs_user}
spring.datasource.password=${DB_PASSWORD:odyxs_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


# Evitar warning de open-in-view
spring.jpa.open-in-view=false

# Tamano maximo de archivo subido
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=8080

# i18n
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=false

# ── Chatbot ODYX — Google Gemini (opcional) ────────────────
# La clave se lee de la variable de entorno GEMINI_API_KEY (no se hardcodea).
# Define GEMINI_API_KEY en tu entorno o en un archivo .env (ver .env.example).
# Obtén tu key gratis en: https://aistudio.google.com/app/apikey
gemini.api.key=${GEMINI_API_KEY:}
